[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "pharmflux"
version = "0.1.0"
requires-python = ">=3.10"
description = "Experimental Rust pharmacology model compiler and simulation engine"
license = "Apache-2.0"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "bindings/python/python"
module-name = "pharmflux._native"
features = ["pyo3/extension-module"]
locked = true

# Preserve the workspace and Cargo.lock; Cargo-based sdists prune workspace members.
sdist-generator = "git"
include = [
  { path = "pyproject.toml", format = "sdist" },
  { path = "Cargo.toml", format = "sdist" },
  { path = "Cargo.lock", format = "sdist" },
  { path = ".cargo/config.toml", format = "sdist" },
  { path = "LICENSE", format = "sdist" },
  { path = "README.md", format = "sdist" },
  { path = "crates/*/Cargo.toml", format = "sdist" },
  { path = "crates/*/build.rs", format = "sdist" },
  { path = "crates/*/src/**/*.rs", format = "sdist" },
  { path = "crates/*/examples/**/*.rs", format = "sdist" },
  { path = "bindings/*/Cargo.toml", format = "sdist" },
  { path = "bindings/*/src/**/*.rs", format = "sdist" },
  { path = "bindings/python/python/**/*.py", format = "sdist" },
  { path = "bindings/python/python/**/*.pyi", format = "sdist" },
  { path = "bindings/python/python/**/py.typed", format = "sdist" },
  { path = "conformance/*.rs", format = "sdist" },
  { path = "conformance/tmdd-cases.json", format = "sdist" },
  { path = "vendor/diffsol/**", format = "sdist" },
  { path = "vendor/DIFFSOL-PROVENANCE.md", format = "sdist" },
]
