name: Test

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Test browser client
        run: node --test bindings/wasm/js/client.test.mjs
      - name: Add browser target
        run: rustup target add wasm32-unknown-unknown
      - name: Check browser engine
        run: cargo check -p pharmflux-wasm --target wasm32-unknown-unknown --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python binding and test tools
        run: python -m pip install . pytest
      - name: Test Python binding
        run: python -m pytest bindings/python/tests

  r-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install R build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base-dev
      - name: Build R bridge
        run: cargo build -p pharmflux-r --locked
