name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install Python binding and documentation dependencies
        run: python -m pip install . -r docs/requirements.txt
      - name: Install R binding and rendering dependencies
        run: |
          Rscript -e 'install.packages(c("jsonlite", "knitr", "rmarkdown"), repos="https://cloud.r-project.org")'
          cargo fetch --locked
          R CMD INSTALL bindings/r
      - name: Generate executable guides
        run: python scripts/build_user_guide_formats.py
      - name: Execute Python guide
        run: |
          python -m nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=300 docs/PYTHON-USER-GUIDE.ipynb
          python -m nbconvert --to html docs/PYTHON-USER-GUIDE.ipynb
      - name: Execute R guide
        run: Rscript -e 'rmarkdown::render("docs/R-USER-GUIDE.Rmd", quiet=TRUE)'
      - name: Build site and check local links
        run: python scripts/build_quickstart_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: docs/_site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: docs/_site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4
